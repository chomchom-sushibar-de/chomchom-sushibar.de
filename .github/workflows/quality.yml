name: Technische Qualität

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci
      - name: Chromium für Browserprüfungen installieren
        run: npx playwright install --with-deps chromium
      - name: Abhängigkeiten auditieren
        run: npm audit --audit-level=high
      - name: Tests, Lighthouse-Budgets und Build prüfen
        run: npm run release:check
      - name: Prüfberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
