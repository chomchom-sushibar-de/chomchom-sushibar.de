name: CMS-PR prüfen

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cms-editorial-safety:
    name: CMS editorial safety
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CMS-, Inhalts- und Deployment-Grenzen prüfen
        run: node scripts/verify-cms-workflow.mjs
      - name: JavaScript-Syntax prüfen
        run: |
          node --check script.js
          node --check i18n.js
          node --check order.js
          node --check gate.js
      - name: Pull-Request-Diff prüfen
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
